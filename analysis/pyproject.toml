[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marsaspen-analysis"
version = "0.1.0"
description = "Python readers and plotting tools for MarsASPEN.jl output."
requires-python = ">=3.10"
dependencies = ["h5py", "matplotlib", "numpy", "scipy"]

[project.scripts]
marsaspen-plot = "marsaspen_analysis.plotting:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marsaspen_analysis*"]
